services:
  app:
    build: .
    image: traveleasy-app
    container_name: traveleasy-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: TravelEasy
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY is required, generate one with php artisan key:generate --show}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: traveleasy
      DB_USERNAME: traveleasy
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-traveleasy}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      RUN_SEED: ${RUN_SEED:-true}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: traveleasy-db
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: traveleasy
      MYSQL_USER: traveleasy
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-traveleasy}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DOCKER_DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-storage:
  db-data:
